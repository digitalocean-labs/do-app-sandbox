name: Publish to PyPI

on:
  # Trigger on release creation (uses token by default)
  release:
    types: [published]

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match pyproject.toml)'
        required: false
        type: string
      publish_method:
        description: 'Publishing method'
        required: true
        default: 'token'
        type: choice
        options:
          - token
          - trusted-publisher

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Install SBOM tooling
        run: pip install cyclonedx-bom

      - name: Generate SBOM
        run: cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-token:
    name: Publish via API token
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish_method != 'trusted-publisher'

    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Summary
        run: |
          echo "## Published to PyPI! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** do-app-sandbox" >> $GITHUB_STEP_SUMMARY
          echo "**Method:** API token" >> $GITHUB_STEP_SUMMARY
          echo "**Files:**" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY

  publish-oidc:
    name: Publish via Trusted Publisher
    needs: build
    runs-on: ubuntu-latest
    if: inputs.publish_method == 'trusted-publisher'
    environment: pypi

    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Summary
        run: |
          echo "## Published to PyPI! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** do-app-sandbox" >> $GITHUB_STEP_SUMMARY
          echo "**Method:** Trusted Publisher (OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "**Files:**" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY
