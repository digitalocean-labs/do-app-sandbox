<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO App Sandbox — Architecture Explorer</title>
<style>
:root{--bg:#06090f;--s1:#0d1220;--s2:#131a2e;--bdr:#1e2d4a;--acc:#0069ff;--grn:#10b981;--red:#ef4444;--org:#f59e0b;--pur:#8b5cf6;--cyn:#06b6d4;--t1:#e2e8f0;--t2:#94a3b8;--t3:#64748b}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--t1);font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(6,9,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);padding:10px 20px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;background:var(--acc);border-radius:8px;display:grid;place-items:center;font:800 13px/1 system-ui;color:#fff}
.hdr h1{font-size:14px;font-weight:700}.hdr h1 span{color:var(--acc)}
.badge{background:var(--org);color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px}
.crumbs{display:flex;align-items:center;gap:3px;margin-left:auto;font-size:12px}
.crumb{color:var(--acc);cursor:pointer;padding:4px 10px;border-radius:6px;transition:.2s;font-weight:600}.crumb:hover{background:#0069ff22;text-decoration:underline}
.sep{color:var(--t3);font-size:10px}.cur{color:var(--t2)}
canvas#bg{position:fixed;inset:0;top:46px;z-index:0;pointer-events:none}
.vp{position:fixed;inset:0;top:46px;overflow:hidden;z-index:1}
.ly{position:absolute;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .4s,transform .5s cubic-bezier(.22,1,.36,1)}
.ly.zin{transform:scale(.75)}.ly.zout{transform:scale(1.4)}
.ly.active{opacity:1;pointer-events:all;transform:scale(1)!important}

/* Back */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;background:rgba(13,18,32,.85);backdrop-filter:blur(12px);border:1.5px solid var(--bdr);color:var(--acc);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;position:sticky;top:8px;z-index:10;margin-bottom:8px}
.back-btn:hover{background:var(--s2);border-color:var(--acc);transform:translateX(-3px)}

/* SVG */
.svg-node{cursor:pointer;transition:filter .2s}.svg-node:hover{filter:drop-shadow(0 0 12px rgba(0,105,255,.35))}
.flow-dash{animation:fd 1.5s linear infinite}@keyframes fd{to{stroke-dashoffset:-20}}

/* Home */
.home-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 20px 60px;gap:16px}
.home-wrap h2{font-size:20px;font-weight:800;text-align:center}.home-wrap>p{font-size:13px;color:var(--t2);text-align:center}
.home-svg{max-width:880px;width:95vw}.home-svg svg{width:100%}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-width:880px;width:95vw}
.jcard{background:var(--s1);border:1.5px solid var(--bdr);border-radius:12px;padding:14px;cursor:pointer;transition:all .25s;display:flex;gap:10px;align-items:flex-start}
.jcard:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 8px 20px #0069ff10}
.jcard .ji{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--s2);border-radius:10px;flex-shrink:0}
.jcard h3{font-size:12px;font-weight:700;margin-bottom:2px}.jcard p{font-size:10.5px;color:var(--t2);line-height:1.4}

/* Layer view */
.layer-wrap{display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.layer-wrap h2{font-size:20px;font-weight:800}.layer-wrap>p{font-size:13px;color:var(--t2);max-width:650px;text-align:center;line-height:1.5}
.layer-svg{max-width:820px;width:95vw;background:var(--s1);border:1px solid var(--bdr);border-radius:16px;padding:20px;overflow-x:auto}
.layer-svg svg{width:100%;min-width:600px}
.drag-hint{font-size:11px;color:var(--t3);text-align:center;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.drag-hint span{display:inline-block;width:16px;height:16px;border:1.5px solid var(--t3);border-radius:4px;font-size:9px;text-align:center;line-height:16px}
.svg-node.dragging{cursor:grabbing;filter:drop-shadow(0 0 20px rgba(0,105,255,.5))!important}
.svg-node{cursor:grab}

/* Journey */
.jv-wrap{display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}
.jv-wrap h2{font-size:20px;font-weight:800;text-align:center}.jv-wrap>p{font-size:13px;color:var(--t2);text-align:center;max-width:550px;line-height:1.6}
.cmp{display:flex;gap:14px;max-width:600px;width:100%;flex-wrap:wrap;justify-content:center}
.cmp-box{flex:1;min-width:230px;background:var(--s1);border-radius:14px;padding:16px;border:1.5px solid var(--bdr);text-align:center}
.cmp-box h3{font-size:13px;font-weight:700;margin-bottom:4px}
.cmp-box .big{font-size:30px;font-weight:800;margin:6px 0}
.cmp-box p{font-size:11px;color:var(--t2)}
.steps{display:flex;flex-direction:column;max-width:550px;width:100%}
.step{display:flex;gap:12px;align-items:flex-start;opacity:0;transform:translateY(10px);animation:stepIn .4s ease forwards}
@keyframes stepIn{to{opacity:1;transform:none}}
.step-ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex-shrink:0;border:2px solid var(--bdr);background:var(--s1);z-index:2}
.step-bd{flex:1;padding-bottom:18px;position:relative}
.step-bd::before{content:'';position:absolute;left:-28px;top:44px;bottom:0;width:2px;background:var(--bdr)}
.step:last-child .step-bd::before{display:none}
.step-bd h3{font-size:12px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.step-bd p{font-size:11px;color:var(--t2);line-height:1.5}
.step-bd .albl{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;background:var(--s2);color:var(--cyn);border:1px solid #06b6d430}
.loc{font-size:9px;padding:2px 6px;border-radius:5px;font-weight:600}
.loc-local{background:#0069ff12;color:var(--acc);border:1px solid #0069ff25}
.loc-sdk{background:#8b5cf612;color:var(--pur);border:1px solid #8b5cf625}
.loc-do{background:#10b98112;color:var(--grn);border:1px solid #10b98125}
.loc-container{background:#f59e0b12;color:var(--org);border:1px solid #f59e0b25}

/* Module detail */
.mod-wrap{display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}
.mod-hero{max-width:700px;width:100%;background:var(--s1);border:1.5px solid var(--bdr);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.mod-hero .bar{position:absolute;top:0;left:0;right:0;height:3px}
.mod-hero h2{font-size:17px;font-weight:800;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.mod-hero .analogy{font-size:13px;color:var(--t2);line-height:1.6;margin-top:6px;font-style:italic;border-left:3px solid var(--acc);padding-left:10px}
.cap-title{max-width:700px;width:100%;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--cyn);font-weight:700}
.cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-width:700px;width:100%}
.cap{background:var(--s1);border:1.5px solid var(--bdr);border-radius:12px;padding:14px;cursor:pointer;transition:all .25s;position:relative}
.cap:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 6px 20px #0069ff10}
.cap .cap-ico{font-size:22px;margin-bottom:4px}
.cap h4{font-size:12px;font-weight:700;margin-bottom:3px}
.cap p{font-size:10.5px;color:var(--t2);line-height:1.4}
.cap .cap-link{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;font-weight:700;color:var(--acc);padding:3px 8px;background:#0069ff08;border:1px solid #0069ff20;border-radius:6px;width:fit-content}
.cap .cap-link:hover{background:#0069ff15}
.cap.cap-bug{border-color:#ef444430}.cap.cap-bug:hover{border-color:var(--red)}
.cap.cap-bug h4{color:var(--red)}
.cap.cap-dead{border-style:dashed;opacity:.6}.cap.cap-dead:hover{opacity:.8}
.used-by-title{max-width:700px;width:100%;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--grn);font-weight:700;margin-top:4px}
.used-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-width:700px;width:100%}
.ub{background:var(--s1);border:1.5px solid var(--bdr);border-radius:12px;padding:12px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:10px}
.ub:hover{border-color:var(--grn);transform:translateY(-2px)}
.ub .ub-arr{color:var(--grn);font-size:16px;flex-shrink:0}
.ub h4{font-size:12px;font-weight:700}.ub p{font-size:10px;color:var(--t2)}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">S</div><h1><span>DO App</span> Sandbox</h1><span class="badge">v0.2.2</span>
  <div class="crumbs" id="crumbs"></div>
</div>
<canvas id="bg"></canvas>
<div class="vp">
  <div class="ly active" id="ly-home"></div>
  <div class="ly" id="ly-layer"></div>
  <div class="ly" id="ly-journey"></div>
  <div class="ly" id="ly-module"></div>
</div>

<script>
// Particles
!function(){const c=document.getElementById('bg'),x=c.getContext('2d');let w,h,P=[];function rs(){w=c.width=innerWidth;h=c.height=innerHeight;P=[];for(let i=0;i<45;i++)P.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3})}function dr(){x.clearRect(0,0,w,h);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle='rgba(0,105,255,.1)';x.fill()});for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<100){x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.strokeStyle=`rgba(0,105,255,${.03*(1-d/100)})`;x.stroke()}}requestAnimationFrame(dr)}rs();dr();addEventListener('resize',rs)}();

// ===== LAYER GRAPH DEFINITIONS =====
const LG={
  sdk:{title:"SDK Layer",color:"#0069ff",desc:"The public API surface your code uses directly. Three active modules, one disconnected experiment.",
    W:740,H:240,
    nodes:[
      {id:"async_sandbox",x:30,y:10,w:180,h:56,lbl:"⚡ AsyncSandbox",sub:"async wrapper",c:"#0069ff"},
      {id:"sandbox",x:30,y:155,w:180,h:56,lbl:"🎛️ Sandbox",sub:"the front desk",c:"#0069ff"},
      {id:"manager",x:330,y:82,w:190,h:56,lbl:"🏊 SandboxManager",sub:"warm pool",c:"#10b981"},
      {id:"adaptive_pool",x:580,y:82,w:140,h:56,lbl:"📈 AdaptivePool",sub:"unused / dead code",c:"#ef4444",dash:true}
    ],
    edges:[
      {f:"async_sandbox",t:"sandbox",lbl:"wraps every call via asyncio.to_thread()"},
      {f:"manager",t:"sandbox",lbl:"creates & pools sandboxes for instant access"}
    ]
  },
  engine:{title:"Execution Engine",color:"#8b5cf6",desc:"Internal plumbing that does the actual work: deploying containers, running commands, moving files, managing processes.",
    W:780,H:370,
    nodes:[
      {id:"deployer",x:20,y:15,w:150,h:56,lbl:"📋 Deployer",sub:"YAML + doctl",c:"#f59e0b"},
      {id:"executor",x:310,y:15,w:150,h:56,lbl:"📟 Executor",sub:"PTY commands",c:"#8b5cf6"},
      {id:"service_client",x:590,y:15,w:165,h:56,lbl:"🌐 ServiceClient",sub:"HTTP commands",c:"#8b5cf6"},
      {id:"filesystem",x:120,y:160,w:160,h:56,lbl:"📂 FileSystem",sub:"file transfers",c:"#06b6d4"},
      {id:"process",x:430,y:160,w:150,h:56,lbl:"⚙️ Process",sub:"background tasks",c:"#06b6d4"},
      {id:"snapshot",x:170,y:295,w:150,h:56,lbl:"📸 Snapshot",sub:"save / restore",c:"#f59e0b"},
      {id:"spaces",x:520,y:295,w:140,h:56,lbl:"☁️ Spaces",sub:"S3 storage",c:"#8b5cf6"}
    ],
    edges:[
      {f:"filesystem",t:"executor",lbl:"runs shell commands (echo, cat, tar) via PTY"},
      {f:"process",t:"executor",lbl:"runs ps, kill, nohup via PTY"},
      {f:"filesystem",t:"spaces",lbl:"large files (≥250KB) via presigned URLs"},
      {f:"snapshot",t:"spaces",lbl:"tar.gz archives uploaded/downloaded"}
    ]
  },
  infra:{title:"DigitalOcean Infrastructure",color:"#10b981",desc:"External services, container images, CLI tools, and foundational types that the entire SDK sits on top of.",
    W:740,H:340,
    nodes:[
      {id:"app_platform",x:20,y:15,w:160,h:56,lbl:"🏗️ App Platform",sub:"managed PaaS",c:"#10b981"},
      {id:"doctl",x:280,y:15,w:140,h:56,lbl:"🔧 doctl CLI",sub:"remote control",c:"#10b981"},
      {id:"do_spaces",x:530,y:15,w:145,h:56,lbl:"💾 DO Spaces",sub:"object storage",c:"#10b981"},
      {id:"worker_image",x:20,y:135,w:160,h:56,lbl:"🐳 Worker Image",sub:"Ubuntu + lang",c:"#10b981"},
      {id:"service_image",x:270,y:135,w:165,h:56,lbl:"🖥️ Service Image",sub:"FastAPI inside",c:"#8b5cf6"},
      {id:"health_server",x:530,y:135,w:155,h:56,lbl:"💚 Health Server",sub:"Go binary :9090",c:"#f59e0b"},
      {id:"types",x:20,y:260,w:130,h:56,lbl:"📐 types.py",sub:"data shapes",c:"#64748b"},
      {id:"exceptions",x:200,y:260,w:155,h:56,lbl:"🚨 exceptions.py",sub:"error catalog",c:"#64748b"},
      {id:"cli",x:410,y:260,w:120,h:56,lbl:"💻 CLI",sub:"sandbox command",c:"#ec4899"},
      {id:"image_registry",x:580,y:260,w:140,h:56,lbl:"🗂️ ImageRegistry",sub:"local JSON",c:"#f59e0b"}
    ],
    edges:[
      {f:"doctl",t:"app_platform",lbl:"every doctl command becomes a DO API call"},
      {f:"health_server",t:"worker_image",lbl:"built into the image, runs on :9090"},
      {f:"cli",t:"image_registry",lbl:"tracks custom images in local JSON file"}
    ]
  }
};

// ===== MODULE DATA =====
const MOD={
  sandbox:{ico:"🎛️",name:"Sandbox",file:"sandbox.py",color:"#0069ff",layer:"sdk",
    analogy:"Like a hotel concierge — you tell it what you need and it coordinates everything behind the scenes.",
    caps:[
      {ico:"🚀",t:"Create sandbox",d:"Deploys a new container on App Platform with the right Docker image",goto:"deployer",gl:"Deployer writes YAML → calls doctl"},
      {ico:"💬",t:"Execute commands (Worker)",d:"Sends your command through a PTY terminal tunnel into the container",goto:"executor",gl:"Executor wraps cmd → pexpect → doctl console"},
      {ico:"🌐",t:"Execute commands (Service)",d:"Sends your command as an HTTP request to the container's API",goto:"service_client",gl:"ServiceClient → POST /api/exec"},
      {ico:"📂",t:"Manage files",d:"Upload, download, read, write files inside the container",goto:"filesystem",gl:"FileSystem handles base64 or Spaces routing"},
      {ico:"⚙️",t:"Background processes",d:"Launch long-running tasks, check their status, read their logs",goto:"process",gl:"ProcessManager → nohup + PID tracking"},
      {ico:"📸",t:"Save & restore state",d:"Snapshot the container's filesystem to Spaces, restore onto a new container",goto:"snapshot",gl:"SnapshotManager → tar.gz → Spaces"},
      {ico:"💤",t:"Hibernate / wake",d:"Hibernate saves state + deletes container ($0). Wake restores on a new container.",goto:"snapshot",gl:"Combines Snapshot + Deployer"},
      {ico:"🗑️",t:"Delete",d:"Destroys the App Platform app and frees all resources",goto:"deployer",gl:"Deployer → doctl apps delete"}
    ],
    used_by:[
      {id:"async_sandbox",why:"wraps every method for async/await usage"},
      {id:"manager",why:"creates sandboxes to fill the warm pool"},
      {id:"cli",why:"CLI commands go through Sandbox"}
    ],
    bugs:["Service mode: file & process managers are None — any call crashes","get_from_id() always creates Worker — can't reconnect Service sandboxes","hibernate() isn't atomic — can orphan apps on partial failure","Git credentials embedded in URLs (insecure)"]
  },
  async_sandbox:{ico:"⚡",name:"AsyncSandbox",file:"async_sandbox.py",color:"#0069ff",layer:"sdk",
    analogy:"A translator that converts synchronous Sandbox calls into async calls so they don't block your event loop.",
    caps:[
      {ico:"🔄",t:"Wraps sync → async",d:"Every single method calls asyncio.to_thread(sandbox.method)",goto:"sandbox",gl:"Delegates everything to sync Sandbox"},
      {ico:"📂",t:"AsyncFileSystem",d:"Wraps all file operations too, same pattern",goto:"sandbox",gl:"to_thread(filesystem.method)"},
      {ico:"⚠️",t:"Broken create()",d:"Passes wrong parameter name — crashes immediately",bug:true},
      {ico:"⚠️",t:"Broken get_from_id()",d:"Passes a parameter that doesn't exist — also crashes",bug:true}
    ],
    used_by:[{id:"manager",why:"SandboxManager uses AsyncSandbox for pool ops"}],
    bugs:["create() passes component_type= instead of mode= → TypeError","get_from_id() passes registry= which doesn't exist → TypeError"]
  },
  manager:{ico:"🏊",name:"SandboxManager",file:"manager.py",color:"#10b981",layer:"sdk",
    analogy:"Like a car rental lot that keeps cars warmed up. When you arrive, you grab one instantly instead of waiting for it to start.",
    caps:[
      {ico:"⚙️",t:"Configure pools",d:"Set target_ready (how many to keep warm), max_ready, idle_timeout per image type"},
      {ico:"🔄",t:"Background replenish loop",d:"Every 5 seconds, checks if pool is below target and creates more sandboxes",goto:"async_sandbox",gl:"Creates via AsyncSandbox.create()"},
      {ico:"📦",t:"Queue of ready sandboxes",d:"Pre-warmed sandboxes sit in an asyncio.Queue waiting to be grabbed"},
      {ico:"⚡",t:"Instant acquire()",d:"Pops a sandbox from the queue — milliseconds instead of minutes"},
      {ico:"🧹",t:"Stale cleanup",d:"Sandboxes older than max_warm_age (30 min) are recycled automatically"},
      {ico:"📊",t:"Metrics & OTEL hooks",d:"Tracks ready count, in-use count, total created — OpenTelemetry compatible"},
      {ico:"📸",t:"Snapshot restore",d:"Can acquire sandboxes pre-loaded with a saved state",goto:"snapshot",gl:"Restores snapshot after acquire"}
    ],
    used_by:[],
    bugs:["release() has no identity check — double-release corrupts count","sync wrappers use asyncio.run() — deadlocks with existing event loops","A retry method exists but is never called"]
  },
  adaptive_pool:{ico:"📈",name:"AdaptivePool",file:"adaptive_pool.py",color:"#ef4444",layer:"sdk",
    analogy:"A weather forecaster for sandbox demand — designed to predict how many you'll need. But it was never plugged in.",
    caps:[
      {ico:"📊",t:"EMA Sizer",d:"Exponential moving average smooths demand signal",dead:true},
      {ico:"🎛️",t:"PID Controller",d:"Proportional-integral-derivative feedback loop",dead:true},
      {ico:"🔮",t:"Predictive Sizer",d:"Calendar-based prediction of demand patterns",dead:true},
      {ico:"📈",t:"Queuing Theory",d:"Uses Little's Law to estimate needed pool size",dead:true},
      {ico:"🔌",t:"Not connected",d:"No module imports this file — all 737 lines are dead code",bug:true}
    ],
    used_by:[],
    bugs:["Uses random.poisson() which doesn't exist → crash","Calendar calc breaks across month boundaries","Not integrated anywhere — completely dead code"]
  },
  deployer:{ico:"📋",name:"Deployer",file:"deployer.py",color:"#f59e0b",layer:"engine",
    analogy:"Fills out the official paperwork (YAML) to rent a server, then submits the order to DigitalOcean via doctl.",
    caps:[
      {ico:"📝",t:"Write YAML app spec",d:"Picks from 3 templates: Worker (PTY), Service (HTTP), Streaming Service (SSE)"},
      {ico:"🖼️",t:"Resolve Docker image",d:"Maps 'python' → ghcr.io/bikramkgupta/sandbox-python:latest"},
      {ico:"🔧",t:"Call doctl",d:"Runs doctl apps create --spec file.yaml as a subprocess on your machine",goto:"doctl",gl:"subprocess.run → doctl CLI"},
      {ico:"⏳",t:"Poll until ready",d:"Runs doctl apps get every few seconds until status = ACTIVE (up to 5 min)"},
      {ico:"📋",t:"Return AppInfo",d:"Gives back app ID, public URL, status, and the auth token for Service mode"},
      {ico:"🗑️",t:"Delete app",d:"Runs doctl apps delete ID --force",goto:"doctl",gl:"subprocess.run → doctl CLI"}
    ],
    used_by:[{id:"sandbox",why:"create() and delete() go through Deployer"},{id:"cli",why:"CLI create/delete commands use Deployer"}],
    bugs:["YAML built with .format() — special characters break the spec","Image tags evaluated at import — env changes ignored after"]
  },
  executor:{ico:"📟",name:"Executor",file:"executor.py",color:"#8b5cf6",layer:"engine",
    analogy:"A robot that types commands into a remote terminal. It uses pexpect to control a live shell session inside the container.",
    caps:[
      {ico:"🔌",t:"Open PTY connection",d:"Spawns doctl apps console via pexpect — creates a live terminal into the container",goto:"doctl",gl:"pexpect.spawn('doctl apps console ...')"},
      {ico:"🎁",t:"Wrap command",d:"Adds exit-code markers + stderr redirect so it can parse the result later"},

// ===== NAVIGATION =====
let stack=[];let busy=false;
function goBack(){if(stack.length>=2)go(stack[stack.length-2].v,stack[stack.length-2].id,'out');else if(stack.length===1)go('home',null,'out')}
function go(v,id,dir){
  if(busy)return;
  const prev=document.querySelector('.ly.active');
  const tgt=document.getElementById('ly-'+(v==='layer'?'layer':v==='journey'?'journey':v==='module'?'module':'home'));
  dir=dir||(v==='home'?'out':'in');

  if(v==='home'){buildHome();stack=[];}
  else if(v==='layer'){buildLayer(id);stack=[{v:'layer',id}];}
  else if(v==='journey'){buildJourney(id);stack=[{v:'journey',id}];}
  else if(v==='module'){
    const m=MOD[id];
    const layId=m?m.layer:'sdk';
    if(stack.length===0||stack[0].v!=='layer') stack=[{v:'layer',id:layId}];
    // If last item is a module, replace it; otherwise push
    if(stack.length>=2&&stack[stack.length-1].v==='module') stack[stack.length-1]={v:'module',id};
    else stack.push({v:'module',id});
    buildModule(id);
  }

  if(prev&&prev!==tgt){
    busy=true;prev.classList.remove('active');prev.classList.add(dir==='in'?'zout':'zin');
    setTimeout(()=>{prev.classList.remove('zout','zin');busy=false},450);
    tgt.classList.remove('zin','zout');tgt.classList.add(dir==='in'?'zin':'zout');
    void tgt.offsetWidth;tgt.classList.remove('zin','zout');tgt.classList.add('active');
  } else if(prev===tgt){
    tgt.style.transition='none';tgt.style.opacity='0';void tgt.offsetWidth;
    tgt.style.transition='';tgt.style.opacity='';
  } else tgt.classList.add('active');
  tgt.scrollTop=0;renderCrumbs();
}
function renderCrumbs(){
  const c=document.getElementById('crumbs');let h=`<span class="crumb" onclick="go('home')">Home</span>`;
  stack.forEach((s,i)=>{
    const last=i===stack.length-1;
    let label=s.v==='layer'?(LG[s.id]?LG[s.id].title:s.id):s.v==='journey'?(JR[s.id]?JR[s.id].title.split('(')[0].trim():s.id):(MOD[s.id]?MOD[s.id].name:s.id);

}

// ===== BUILD LAYER =====
let layerNodes={},layerEdges=[],layerColor='',layerSvg=null,dragInfo=null;

function edgePoint(cx,cy,hw,hh,tx,ty){
  const dx=tx-cx,dy=ty-cy,adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx<.01&&ady<.01) return{x:cx,y:cy};
  if(adx*hh>ady*hw){const s=dx>0?1:-1;return{x:cx+s*hw,y:cy+dy*hw/adx}}
  else{const s=dy>0?1:-1;return{x:cx+dx*hh/ady,y:cy+s*hh}}
}
function calcEdge(e){
  const f=layerNodes[e.f],t=layerNodes[e.t];if(!f||!t)return null;
  const fcx=f.x+f.w/2,fcy=f.y+f.h/2,tcx=t.x+t.w/2,tcy=t.y+t.h/2;
  const p1=edgePoint(fcx,fcy,f.w/2,f.h/2,tcx,tcy);
  const p2=edgePoint(tcx,tcy,t.w/2,t.h/2,fcx,fcy);
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
  const dx=p2.x-p1.x,dy=p2.y-p1.y,d=Math.hypot(dx,dy);
  if(d<1) return null;
  const curve=Math.min(35,d*.2);
  const nx=-dy/d,ny=dx/d;
  const cx=mx+nx*curve,cy=my+ny*curve;
  const lx=mx+nx*(curve*.5),ly=my+ny*(curve*.5)-5;
  return{path:`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,lx,ly};
}
function renderEdges(){
  layerEdges.forEach((e,i)=>{
    const r=calcEdge(e);if(!r)return;
    const p=layerSvg.querySelector('#ep'+i);
    const t=layerSvg.querySelector('#et'+i);
    if(p)p.setAttribute('d',r.path);
    if(t){t.setAttribute('x',r.lx);t.setAttribute('y',r.ly)}
  });
}
function renderNode(id){
  const n=layerNodes[id];if(!n)return;
  const g=layerSvg.querySelector(`[data-id="${id}"]`);if(!g)return;
  const rect=g.querySelector('rect');
  const txts=g.querySelectorAll('text');
  rect.setAttribute('x',n.x);rect.setAttribute('y',n.y);
  if(txts[0]){txts[0].setAttribute('x',n.x+n.w/2);txts[0].setAttribute('y',n.y+n.h/2-4)}
  if(txts[1]){txts[1].setAttribute('x',n.x+n.w/2);txts[1].setAttribute('y',n.y+n.h/2+12)}
}

function buildLayer(id){
  const L=LG[id];if(!L)return;
  layerNodes={};layerEdges=L.edges;layerColor=L.color;
  L.nodes.forEach(n=>{layerNodes[n.id]={...n}});
  const el=document.getElementById('ly-layer');

  let svg=`<svg id="layersvg" viewBox="0 0 ${L.W} ${L.H}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="la" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="${L.color}90"/></marker></defs>
    <g id="edgegroup">`;
  L.edges.forEach((e,i)=>{
    const r=calcEdge(e);if(!r)return;
    svg+=`<path id="ep${i}" d="${r.path}" fill="none" stroke="${L.color}50" stroke-width="2" marker-end="url(#la)" stroke-dasharray="6,4" class="flow-dash"/>`;
    svg+=`<text id="et${i}" x="${r.lx}" y="${r.ly}" fill="${L.color}" font-size="8.5" font-weight="600" text-anchor="middle">${e.lbl}</text>`;
  });
  svg+=`</g>`;
  L.nodes.forEach(n=>{
    svg+=`<g class="svg-node" data-id="${n.id}">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="#0d1220" stroke="${n.c}" stroke-width="1.5" ${n.dash?'stroke-dasharray="5,3"':''}/>
      <text x="${n.x+n.w/2}" y="${n.y+n.h/2-4}" fill="#e2e8f0" font-size="11" font-weight="700" text-anchor="middle">${n.lbl}</text>
      <text x="${n.x+n.w/2}" y="${n.y+n.h/2+12}" fill="#64748b" font-size="9" text-anchor="middle">${n.sub}</text>
    </g>`;
  });
  svg+=`</svg>`;

  el.innerHTML=`<div class="layer-wrap">
    <div class="back-btn" onclick="go('home',null,'out')"><span>←</span> Back to overview</div>
    <h2 style="color:${L.color}">${L.title}</h2>
    <p>${L.desc}</p>
    <div class="layer-svg">${svg}</div>
    <div class="drag-hint"><span>✋</span> Drag any box to rearrange &middot; Click a box to zoom in</div>
  </div>`;

  layerSvg=document.getElementById('layersvg');
  // Drag handlers
  layerSvg.addEventListener('mousedown',e=>{
    const g=e.target.closest('.svg-node');if(!g)return;
    const nid=g.dataset.id;
    const pt=layerSvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const sp=pt.matrixTransform(layerSvg.getScreenCTM().inverse());
    const n=layerNodes[nid];
    dragInfo={id:nid,ox:sp.x-n.x,oy:sp.y-n.y,moved:false};
    g.classList.add('dragging');
    e.preventDefault();
  });
  layerSvg.addEventListener('mousemove',e=>{
    if(!dragInfo)return;
    const pt=layerSvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const sp=pt.matrixTransform(layerSvg.getScreenCTM().inverse());
    const n=layerNodes[dragInfo.id];
    n.x=sp.x-dragInfo.ox;n.y=sp.y-dragInfo.oy;
    renderNode(dragInfo.id);renderEdges();
    dragInfo.moved=true;
    e.preventDefault();
  });
  const endDrag=e=>{
    if(!dragInfo)return;
    const g=layerSvg.querySelector(`[data-id="${dragInfo.id}"]`);
    if(g)g.classList.remove('dragging');
    if(!dragInfo.moved) go('module',dragInfo.id);
    dragInfo=null;
  };
  layerSvg.addEventListener('mouseup',endDrag);
  layerSvg.addEventListener('mouseleave',endDrag);
  // Touch support
  layerSvg.addEventListener('touchstart',e=>{
    const g=e.target.closest('.svg-node');if(!g)return;
    const nid=g.dataset.id;
    const touch=e.touches[0];
    const pt=layerSvg.createSVGPoint();pt.x=touch.clientX;pt.y=touch.clientY;
    const sp=pt.matrixTransform(layerSvg.getScreenCTM().inverse());
    const n=layerNodes[nid];
    dragInfo={id:nid,ox:sp.x-n.x,oy:sp.y-n.y,moved:false};
    g.classList.add('dragging');
  },{passive:true});
  layerSvg.addEventListener('touchmove',e=>{
    if(!dragInfo)return;
    const touch=e.touches[0];
    const pt=layerSvg.createSVGPoint();pt.x=touch.clientX;pt.y=touch.clientY;
    const sp=pt.matrixTransform(layerSvg.getScreenCTM().inverse());
    const n=layerNodes[dragInfo.id];
    n.x=sp.x-dragInfo.ox;n.y=sp.y-dragInfo.oy;
    renderNode(dragInfo.id);renderEdges();
    dragInfo.moved=true;
    e.preventDefault();
  },{passive:false});
  layerSvg.addEventListener('touchend',e=>{
    if(!dragInfo)return;
    const g=layerSvg.querySelector(`[data-id="${dragInfo.id}"]`);
    if(g)g.classList.remove('dragging');
    if(!dragInfo.moved) go('module',dragInfo.id);
    dragInfo=null;
  });
}

// ===== BUILD MODULE =====
function buildModule(id){
  const m=MOD[id];if(!m)return;
  const el=document.getElementById('ly-module');
  const backId=stack.length>=2?stack[stack.length-2]:null;
  const backLabel=backId?(backId.v==='layer'?LG[backId.id].title:'Back'):'Overview';
  const backAction=backId?`go('${backId.v}','${backId.id}','out')`:`go('home',null,'out')`;
  let h=`<div class="mod-wrap">
    <div class="back-btn" onclick="${backAction}"><span>←</span> ${backLabel}</div>
    <div class="mod-hero"><div class="bar" style="background:${m.color}"></div>
      <h2 style="color:${m.color}">${m.ico} ${m.name} <span style="font-size:12px;color:var(--t3);font-weight:400;font-family:monospace">${m.file}</span></h2>
      <div class="analogy">${m.analogy}</div>
    </div>
    <div class="cap-title">What it does — click any box to explore</div>
    <div class="cap-grid">`;
  (m.caps||[]).forEach(c=>{
    const cls=c.bug?'cap cap-bug':c.dead?'cap cap-dead':'cap';
    const click=c.goto?`onclick="go('module','${c.goto}')"`:c.bug||c.dead?'':'';
    h+=`<div class="${cls}" ${click}>
      <div class="cap-ico">${c.ico}</div>
      <h4>${c.t}</h4>
      <p>${c.d}</p>
      ${c.goto?`<div class="cap-link">→ ${MOD[c.goto]?MOD[c.goto].ico+' '+MOD[c.goto].name:c.goto}${c.gl?' — '+c.gl:''}</div>`:''}
    </div>`;
  });
  h+=`</div>`;
  // Used by
  if(m.used_by&&m.used_by.length){
    h+=`<div class="used-by-title">Who uses this module</div><div class="used-grid">`;
    m.used_by.forEach(u=>{
      const um=MOD[u.id];
      h+=`<div class="ub" onclick="go('module','${u.id}')"><span class="ub-arr">←</span><div><h4>${um?um.ico+' '+um.name:u.id}</h4><p>${u.why}</p></div></div>`;
    });
    h+=`</div>`;
  }
  // Bugs
  if(m.bugs&&m.bugs.length){
    h+=`<div class="cap-title" style="color:var(--red);margin-top:6px">Known problems (${m.bugs.length})</div><div class="cap-grid">`;
    m.bugs.forEach(b=>{h+=`<div class="cap cap-bug" style="cursor:default"><div class="cap-ico">⚠️</div><p>${b}</p></div>`});
    h+=`</div>`;
  }
  h+=`</div>`;el.innerHTML=h;
}
